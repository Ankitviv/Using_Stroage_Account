# .github/workflows/storage.yml
name: Auto-Format Terraform

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  format:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
      
      - name: Auto-Format Terraform Files
        uses: cloudposse/github-action-auto-format@v0.12.0
        with:
          format-task: terraform
          bot-name: github-actions[bot]
          bot-email: github-actions[bot]@users.noreply.github.com
          workflow-token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Check Formatting
        run: terraform fmt -check -diff
